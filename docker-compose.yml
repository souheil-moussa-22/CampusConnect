services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusconnect123
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - campusconnect_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  campusconnect_data:

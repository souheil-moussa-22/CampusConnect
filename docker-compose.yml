services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusconnect123}
      POSTGRES_DB: ${POSTGRES_DB:-campusconnect}
    ports:
      - "5432:5432"
    volumes:
      - campusconnect_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: campusconnect-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-campusconnect123}@postgres:5432/${POSTGRES_DB:-campusconnect}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-local-development-only-change-this-secret}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET:-local-development-only-change-this-secret}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  campusconnect_data:
